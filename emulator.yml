services:
  aws-emulator:
    build: .
    ports:
      - "127.0.0.1:9297:9297"
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./home:/home/emulator/.aws/emulator
    entrypoint: ["aws-emulator", "-b", "0.0.0.0"]
    command: ["-p", "9297", "-a", "on", "--telemetry", "off"]
